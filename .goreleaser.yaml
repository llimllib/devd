# vim: set ts=2 sw=2 tw=0 fo=cnqoj
version: 2

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: devd
    main: ./cmd/devd
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
  # darwin needs cgo so that file watching uses FSEvents. Without it, notify
  # falls back to kqueue, which opens a file descriptor per watched file and
  # fails with "too many open files" on large trees. This must be built on a
  # macOS host.
  - id: devd-darwin
    main: ./cmd/devd
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - formats: ["tar.gz"]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        formats: ["zip"]

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"

homebrew_casks:
  - name: devd
    homepage: "https://github.com/llimllib/devd"
    description: " A local webserver for developers"
    license: "MIT"
    repository:
      owner: llimllib
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/devd"]
        end
      end
